version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: aniidco_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aniidco_portal
    ports:
      - "5432:5432"
    volumes:
      - aniidco_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: aniidco_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  aniidco_pg_data:
